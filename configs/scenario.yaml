# Default TTC strike scenario. Values are grouped by ownership so field-tuned
# runtime settings do not get confused with simulator-only setup.
simulation:
  vehicle_model:
    profile: default                    # Shared drone profile; URDF supplies mass/inertia.
  scene:
    launch_position: [-5.25, 0.0, 0.05]  # Initial world position in metres.
    target_center: [24.75, 0.0, 1.0]     # 30 m ahead of the launch position.
    target_size_m: 2.0                   # Static cube edge length.
  physical_forces:
    body_drag:
      enabled: true
    angular_damping:
      enabled: true
    wind:
      enabled: true
      world_velocity_mps: [0.0, 0.0, 0.0]
    rotor_aerodynamics:
      enabled: false
    ground_effect:
      enabled: false
    gyroscopic:
      enabled: false

runtime:
  physical_setup:
    camera:
      camera_width_px: 640       # Camera image width.
      camera_height_px: 480      # Camera image height.
      camera_hz: 30              # Camera sampling rate.
      camera_fov_deg: 90.0       # Camera horizontal field of view.
      camera_look_down_deg: 0.0  # Physical camera mounting angle.
  mission:
    takeoff_altitude_m: 15.0     # Height where visual tracking begins.
    impact_altitude_m: 1.0       # Desired altitude at contact.
    forward_speed_mps: 13.0      # Desired forward velocity.
    nominal_pitch_deg: 20.0      # Initial forward pitch request.
  ttc:
    commit_box_height_fraction: 0.1  # Bbox height fraction that arms commit.
    alpha: 0.85                       # Trust in each measured bbox scale.
    beta: 0.05                        # Trust in the bbox-scale-rate correction.
  sensors:
    barometer:
      sample_hz: 40.0                 # BMP388 barometer rate, independent of the camera.
      altitude_noise_sigma_m: 0.10    # BMP388 full-bandwidth altitude RMS noise [m].
      altitude_bias_m: 0.0            # Fixed takeoff-reference offset [m].
      drift_sigma_m_per_sqrt_s: 0.0   # Disabled slow field-drift random walk [m/sqrt(s)].
      altitude_old_weight: 0.80       # Smooth raw altitude before control [0..1].
      velocity_old_weight: 0.95       # Smooth noisy differentiated altitude into vertical speed [0..1].
    imu:
      sample_hz: 240.0
      accelerometer_noise_sigma_mps2: 0.0075
      accelerometer_initial_bias_sigma_mps2: 0.0981
      accelerometer_bias_random_walk_mps2_per_sqrt_s: 0.0049
  vertical_estimator:
    alpha: 0.08
    beta: 0.005
