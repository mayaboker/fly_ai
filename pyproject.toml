[project]
name = "fly-smart"
version = "0.1.0"
description = "Standalone PyBullet TTC diagonal-strike simulator"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pybullet>=3.2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fly-smart = "fly_smart.simulation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fly_smart"]
